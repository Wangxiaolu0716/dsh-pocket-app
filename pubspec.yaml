name: dsh_pocket
description: "DSH Pocket 手机端：扫码连上你电脑上的 DeepSeek Harness。"
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  mobile_scanner: ^7.4.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # 目录形式：官方发布版打包时才把收款码放进来（tools/publish_server.ps1），
    # 源码仓库里 assets/reward_qr.png 是 gitignore 的，绝不进源码版 APK。
    - assets/
