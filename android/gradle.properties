# 内存别开太大：这台机器同时跑着 DSH/编辑器，8G 堆会让 Gradle 守护进程 OOM 崩掉
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 这台机器上 Kotlin 增量编译常报 "Could not close incremental caches" 直接中断构建，
# 关掉它构建更稳（代价是全量编译，几十秒的事）
kotlin.incremental=false

# 这台机器同时跑着别的东西，限制并发别把内存吃干净（否则 Gradle 守护进程会 OOM 崩掉）
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1g
