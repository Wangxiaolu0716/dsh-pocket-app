# 内存别开太大：这台机器同时跑着 DSH/编辑器，8G 堆会让 Gradle 守护进程 OOM 崩掉
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 这台机器上 Kotlin 增量编译常报 "Could not close incremental caches" 直接中断构建，
# 关掉它构建更稳（代价是全量编译，几十秒的事）
kotlin.incremental=false
